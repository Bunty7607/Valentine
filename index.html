<!DOCTYPE html> 
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laduaaaa / Cutie Pie ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
background:#ffeef2;
}

.app{
max-width:420px;
margin:auto;
padding:18px;
}

.screen{display:none;}
.active{display:block;}

.card{
background:white;
padding:22px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.12);
text-align:center;
}

button{
padding:14px 18px;
border:none;
border-radius:14px;
background:#ff4d6d;
color:white;
margin:8px;
font-size:16px;
}

/* heart explosion */
.confetti{
position:fixed;
font-size:20px;
animation:explode 1.2s ease-out forwards;
}
@keyframes explode{
to{transform:translate(var(--x),var(--y));opacity:0;}
}

/* game */
#gameArea{
height:260px;
background:#fff0f5;
border-radius:16px;
position:relative;
overflow:hidden;
}
.heart{
position:absolute;
font-size:26px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="app">

<!-- START SCREEN -->
<div id="s0" class="screen active">
<div class="card">
<h2>For Laduaaaa / Cutie Pie ❤️</h2>

<button onclick="startApp()">Start</button>

<br><br>

<audio id="song" controls loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_2b2b9a7f04.mp3">
</audio>

</div>
</div>

<!-- QUESTION -->
<div id="s1" class="screen">
<div class="card">
<h2>Will you be my Valentine?</h2>
<button onclick="explodeHearts(this);next();">Yes</button>
<button onclick="alert('No option disabled 😄')">No</button>
</div>
</div>

<!-- HEART GAME -->
<div id="s2" class="screen">
<div class="card">
<h2>Catch the hearts ❤️</h2>
<p>Score: <span id="score">0</span></p>
<div id="gameArea"></div>
</div>
</div>

<!-- END -->
<div id="s3" class="screen">
<div class="card">
<h2>I love you ❤️</h2>
<p id="days"></p>
<button onclick="location.reload()">Replay</button>
</div>
</div>

</div>

<script>
let current=0;
let score=0;

function startApp(){
next();
document.getElementById("song").play().catch(()=>{});
}

function next(){
document.getElementById("s"+current).classList.remove("active");
current++;
document.getElementById("s"+current).classList.add("active");
counter();
}

/* love counter */
function counter(){
const start=new Date("May 25, 2024");
const today=new Date();
const days=Math.floor((today-start)/(1000*60*60*24));
const el=document.getElementById("days");
if(el)el.innerText="Together for "+days+" days ❤️";
}

/* confetti explosion */
function explodeHearts(btn){
const rect=btn.getBoundingClientRect();
for(let i=0;i<25;i++){
const h=document.createElement("div");
h.className="confetti";
h.innerHTML="❤️";
h.style.left=(rect.left+20)+"px";
h.style.top=(rect.top+10)+"px";
h.style.setProperty("--x",(Math.random()*200-100)+"px");
h.style.setProperty("--y",(Math.random()*200-100)+"px");
document.body.appendChild(h);
setTimeout(()=>h.remove(),1200);
}
}

/* HEART GAME */
const gameArea=document.getElementById("gameArea");

setInterval(()=>{
if(current!==2) return;

const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*90+"%";
heart.style.top="0px";

gameArea.appendChild(heart);

let pos=0;
const fall=setInterval(()=>{
pos+=3;
heart.style.top=pos+"px";
if(pos>240){
heart.remove();
clearInterval(fall);
}
},20);

heart.onclick=()=>{
score++;
document.getElementById("score").innerText=score;
heart.remove();
clearInterval(fall);

if(score>=5){
next();
}
};

},900);
</script>

</body>
</html>
