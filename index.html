<!DOCTYPE html> 
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laduaaaa / Cutie Pie ❤️</title>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:linear-gradient(135deg,#ffd6e0,#ffeef2);
overflow-x:hidden;
}

.app{
max-width:420px;
margin:auto;
min-height:100vh;
padding:18px;
box-sizing:border-box;
}

/* screens */
.screen{
display:none;
animation:fadeIn 0.5s ease;
}

.active{
display:block;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

/* card UI */
.card{
background:white;
padding:24px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.12);
text-align:center;
}

/* buttons */
button{
padding:14px 18px;
border:none;
border-radius:14px;
background:#ff4d6d;
color:white;
margin:8px;
font-size:16px;
cursor:pointer;
transition:all 0.2s ease;
}

button:active{
transform:scale(0.95);
}

/* funny popup */
#funnyBox{
display:none;
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
background:#ff4d6d;
color:white;
padding:12px 18px;
border-radius:20px;
animation:pop 0.4s ease;
}

@keyframes pop{
from{transform:translate(-50%,20px);opacity:0;}
to{transform:translate(-50%,0);opacity:1;}
}

/* kiss animation */
.kiss{
position:fixed;
font-size:28px;
animation:floatUp 2s forwards;
}

@keyframes floatUp{
from{transform:translateY(0);opacity:1;}
to{transform:translateY(-200px);opacity:0;}
}

/* heart game */
#gameArea{
height:240px;
background:#fff0f5;
border-radius:16px;
position:relative;
}

/* tap game */
.tapCircle{
width:60px;
height:60px;
background:#ff4d6d;
border-radius:50%;
position:absolute;
animation:popIn 0.2s ease;
}

@keyframes popIn{
from{transform:scale(0);}
to{transform:scale(1);}
}
</style>
</head>

<body>

<div class="app">

<div id="s1" class="screen active">
<div class="card">
<h2>Hi Laduaaaa / Cutie Pie ❤️</h2>
<p>Tap to start</p>
<button onclick="startApp()">Start</button>
</div>
</div>

<div id="s2" class="screen">
<div class="card">
<h2>Will you be my Valentine?</h2>
<button onclick="next()">Yes</button>
<button onclick="funnyNo()">No</button>
</div>
</div>

<div id="s3" class="screen">
<div class="card">
<h2>Memory Quiz ❤️</h2>
<p>When did we meet?</p>
<button onclick="wrong()">2023</button>
<button onclick="correct()">25 May 2024</button>
</div>
</div>

<div id="s4" class="screen">
<div class="card">
<h2>Catch the hearts ❤️</h2>
<p>Score: <span id="score">0</span></p>
<div id="gameArea"></div>
</div>
</div>

<div id="s5" class="screen">
<div class="card">
<h2>Tap Game 😄</h2>
<p>Score: <span id="tapScore">0</span></p>
<div id="tapArea" style="height:240px;background:#fdf2f5;border-radius:16px;position:relative;"></div>
</div>
</div>

<div id="s6" class="screen">
<div class="card">
<h2>Surprise ❤️</h2>
<button onclick="reveal()">Tap me</button>
<p id="surprise" style="display:none;">You are my happiness forever.</p>
<button onclick="next()">Next</button>
</div>
</div>

<div id="s7" class="screen">
<div class="card">
<h2>I love you Laduaaaa / Cutie Pie ❤️</h2>
<p id="days"></p>
<button onclick="next()">Finish</button>
</div>
</div>

<div id="s8" class="screen">
<div class="card">
<h1 style="color:#ff4d6d;">Forever Us ❤️</h1>
<button onclick="replay()">Replay</button>
</div>
</div>

</div>

<div id="funnyBox">No option not available 😄</div>

<audio id="song" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8a4d9c0e3.mp3">
</audio>

<script>
let current=1;
let score=0;
let tapScore=0;

function startApp(){
document.getElementById("song").play().catch(()=>{});
next();
}

function next(){
document.getElementById("s"+current).classList.remove("active");
current++;
document.getElementById("s"+current).classList.add("active");
kiss();
counter();
}

function funnyNo(){
const box=document.getElementById("funnyBox");
box.style.display="block";
setTimeout(()=>box.style.display="none",1500);
kiss();
}

function correct(){ next(); }
function wrong(){ alert("Try again 😄"); }

function reveal(){
document.getElementById("surprise").style.display="block";
kiss();
}

function kiss(){
for(let i=0;i<4;i++){
const k=document.createElement("div");
k.className="kiss";
k.innerHTML="😘";
k.style.left=Math.random()*90+"vw";
k.style.bottom="0px";
document.body.appendChild(k);
setTimeout(()=>k.remove(),2000);
}
}

function counter(){
const start=new Date("May 25, 2024");
const today=new Date();
const days=Math.floor((today-start)/(1000*60*60*24));
const el=document.getElementById("days");
if(el)el.innerText="Together for "+days+" days ❤️";
}

function replay(){ location.reload(); }

/* heart game */
const area=document.getElementById("gameArea");
setInterval(()=>{
if(!area||current!==4)return;
const h=document.createElement("div");
h.innerHTML="❤️";
h.style.position="absolute";
h.style.left=Math.random()*90+"%";
h.style.top=Math.random()*90+"%";
h.onclick=()=>{
score++;
document.getElementById("score").innerText=score;
h.remove();
if(score>=5)next();
};
area.appendChild(h);
setTimeout(()=>h.remove(),1500);
},700);

/* tap game */
const tapArea=document.getElementById("tapArea");
setInterval(()=>{
if(!tapArea||current!==5)return;
const c=document.createElement("div");
c.className="tapCircle";
c.style.left=Math.random()*80+"%";
c.style.top=Math.random()*70+"%";
c.onclick=()=>{
tapScore++;
document.getElementById("tapScore").innerText=tapScore;
c.remove();
if(tapScore>=5)next();
};
tapArea.appendChild(c);
setTimeout(()=>c.remove(),1500);
},900);
</script>

</body>
</html>
