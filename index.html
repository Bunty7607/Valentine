<!DOCTYPE html> 
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laduaaaa / Cutie Pie ❤️</title>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#ffeef2;
overflow-x:hidden;
}

.app{
max-width:420px;
margin:auto;
padding:18px;
position:relative;
z-index:2;
}

.screen{display:none;}
.active{display:block;animation:fade .5s ease;}

@keyframes fade{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

.card{
background:white;
padding:22px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.12);
text-align:center;
}

button{
padding:14px 18px;
border:none;
border-radius:14px;
background:#ff4d6d;
color:white;
margin:8px;
font-size:16px;
cursor:pointer;
}

/* confetti explosion */
.confetti{
position:fixed;
font-size:20px;
animation:explode 1.2s ease-out forwards;
}

@keyframes explode{
to{
transform:translate(var(--x),var(--y)) rotate(360deg);
opacity:0;
}
}

/* particle hearts */
.particle{
position:fixed;
font-size:18px;
animation:float 6s linear infinite;
opacity:0.5;
z-index:0;
}
@keyframes float{
from{transform:translateY(100vh);}
to{transform:translateY(-10vh);}
}

/* games */
#gameArea,#tapArea,#fallArea{
height:240px;
background:#fff0f5;
border-radius:16px;
position:relative;
overflow:hidden;
}

.tapCircle{
width:60px;height:60px;border-radius:50%;
background:#ff4d6d;position:absolute;
}

.fallHeart{
position:absolute;
font-size:26px;
transition:top 1.8s linear;
}
</style>
</head>

<body>

<div class="app">

<!-- MUSIC START -->
<div id="s0" class="screen active">
<div class="card">
<h2>For Laduaaaa / Cutie Pie ❤️</h2>
<button onclick="playMusic()">Play Music & Start</button>
</div>
</div>

<!-- Valentine Question -->
<div id="s1" class="screen">
<div class="card">
<h2>Will you be my Valentine?</h2>
<button id="yesBtn" onclick="explodeHearts(this); next();">Yes</button>
<button onclick="funnyNo()">No</button>
</div>
</div>

<!-- Memory Quiz -->
<div id="s2" class="screen">
<div class="card">
<h2>Memory Quiz ❤️</h2>
<p>When did we meet?</p>
<button onclick="wrong()">2023</button>
<button onclick="correct()">25 May 2024</button>
</div>
</div>

<!-- Game 1 -->
<div id="s3" class="screen">
<div class="card">
<h2>Catch hearts ❤️</h2>
<p>Score: <span id="score">0</span></p>
<div id="gameArea"></div>
</div>
</div>

<!-- Game 2 -->
<div id="s4" class="screen">
<div class="card">
<h2>Tap circles 😄</h2>
<p>Score: <span id="tapScore">0</span></p>
<div id="tapArea"></div>
</div>
</div>

<!-- Game 3 -->
<div id="s5" class="screen">
<div class="card">
<h2>Catch falling hearts 💕</h2>
<p>Score: <span id="fallScore">0</span></p>
<div id="fallArea"></div>
</div>
</div>

<!-- Timeline -->
<div id="s6" class="screen">
<div class="card">
<h2>Our Timeline ❤️</h2>
<p>25 May 2024 — We met</p>
<p>First long talk</p>
<p>First laugh together</p>
<button onclick="next()">Next</button>
</div>
</div>

<!-- Ending -->
<div id="s7" class="screen">
<div class="card">
<h1>Forever Us ❤️</h1>
<p id="days"></p>
<button onclick="replay()">Replay</button>
</div>
</div>

</div>

<!-- music -->
<div id="music" style="display:none;">
<iframe width="0" height="0"
src="https://www.youtube.com/embed/P8PWN1OmZOA?autoplay=1&loop=1&playlist=P8PWN1OmZOA"
allow="autoplay">
</iframe>
</div>

<script>
let current=0,score=0,tapScore=0,fallScore=0;

function playMusic(){
document.getElementById("music").style.display="block";
next();
}

function next(){
document.getElementById("s"+current).classList.remove("active");
current++;
document.getElementById("s"+current).classList.add("active");
counter();
}

function funnyNo(){
alert("No option disabled 😄");
}

/* EXPLOSION FROM BUTTON */
function explodeHearts(btn){
const rect=btn.getBoundingClientRect();
const x=rect.left+rect.width/2;
const y=rect.top+rect.height/2;

for(let i=0;i<30;i++){
const h=document.createElement("div");
h.className="confetti";
h.innerHTML="❤️";
h.style.left=x+"px";
h.style.top=y+"px";
h.style.setProperty("--x",(Math.random()*300-150)+"px");
h.style.setProperty("--y",(Math.random()*300-150)+"px");
document.body.appendChild(h);
setTimeout(()=>h.remove(),1200);
}
}

function correct(){ next(); }
function wrong(){ alert("Try again 😄"); }

function counter(){
const start=new Date("May 25, 2024");
const today=new Date();
const days=Math.floor((today-start)/(1000*60*60*24));
const el=document.getElementById("days");
if(el)el.innerText="Together for "+days+" days ❤️";
}

function replay(){ location.reload(); }

/* background hearts */
setInterval(()=>{
const h=document.createElement("div");
h.className="particle";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},900);

/* Game 1 */
setInterval(()=>{
if(current!==3)return;
const h=document.createElement("div");
h.innerHTML="❤️";
h.style.position="absolute";
h.style.left=Math.random()*90+"%";
h.style.top="0";
h.style.transition="top 1.5s linear";
gameArea.appendChild(h);
setTimeout(()=>h.style.top="200px",50);
h.onclick=()=>{score++;scoreEl.innerText=score;h.remove();if(score>=5)next();}
setTimeout(()=>h.remove(),2000);
},700);

/* Game 2 */
setInterval(()=>{
if(current!==4)return;
const c=document.createElement("div");
c.className="tapCircle";
c.style.left=Math.random()*80+"%";
c.style.top=Math.random()*70+"%";
tapArea.appendChild(c);
c.onclick=()=>{tapScore++;tapScoreEl.innerText=tapScore;c.remove();if(tapScore>=5)next();}
setTimeout(()=>c.remove(),1500);
},900);

/* Game 3 */
setInterval(()=>{
if(current!==5)return;
const f=document.createElement("div");
f.className="fallHeart";
f.innerHTML="💖";
f.style.left=Math.random()*90+"%";
f.style.top="0";
fallArea.appendChild(f);
setTimeout(()=>f.style.top="200px",50);
f.onclick=()=>{fallScore++;fallScoreEl.innerText=fallScore;f.remove();if(fallScore>=5)next();}
setTimeout(()=>f.remove(),2000);
},800);
</script>

</body>
</html>
